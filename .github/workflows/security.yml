name: Mobile security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx expo install --check
      - run: npx expo export --platform web
